<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day-05 HTML Tables</title>
</head>
<body>
    
    <h1>HTML Tables</h1>
    <table>
        <tr>
            <th>Sr. No.</th>
            <th>Name</th>
            <th>Age</th>
            <th>City</th>
        </tr>
        <tr>
            <td>1</td>
            <td>John Doe</td>
            <td>25</td>
            <td>New York</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Jane Smith</td>
            <td>30</td>
            <td>Los Angeles</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Mike Johnson</td>
            <td>28</td>
            <td>Chicago</td>
        </tr>
    </table>

    <h1>HTML Table with caption </h1>
    <table>
        <caption>Employee Information</caption>
        <tr>
            <th>Sr. No.</th>
            <th>Name</th>
            <th>Age</th>
            <th>City</th>
        </tr>
        <tr>
            <td>1</td>
            <td>John Doe</td>
            <td>25</td>
            <td>New York</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Jane Smith</td>
            <td>30</td>
            <td>Los Angeles</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Mike Johnson</td>
            <td>28</td>
            <td>Chicago</td>
        </tr>
    </table>

</body>
</html>
