<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 17 Transitions, Transforms and Animations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1 class="topic">Day 17 - Transitions, Transforms & Animations</h1>

       <section class="header-section">
        <header class="header">
            <nav class="nav-list">
                <ul>
                    <li><a href="#" class="nav-items">Home</a></li>
                    <li><a href="#" class="nav-items">Contact</a></li>
                    <li><a href="#" class="nav-items">About</a></li>
                    <li><a href="#" class="nav-items">Projects</a></li>
                </ul>
            </nav>
        </header>
       </section>

    <main>

        <section id="transition">
            <h2>Transitions</h2>
            <button class="transition-box">Hover Me</button>
        </section>

        <section id="transform">
            <h2>Transforms</h2>
            <div class="transform-group">
                <div class="transform-box scale-box">Scale</div>
                <div class="transform-box rotate-box">Rotate</div>
                <div class="transform-box translate-box">Translate</div>
            </div>
        </section>

        <section id="card-hover">
            <h2>Card Hover Effect</h2>
            <div class="hover-card">
                <h3>Hover Card</h3>
                <p>This card lifts and scales on hover.</p>
            </div>
        </section>

        <section id="animation">
            <h2>Keyframe Animation</h2>
            <div class="bounce-box">Bounce</div>
            <div class="spin-box">Spin</div>
        </section>

    </main>

    <footer class="footer">
        <p class="note">Day 17 practice page</p>
    </footer>

</body>
</html>
